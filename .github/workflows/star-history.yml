name: Update Star History

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate charts from GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate-star-history.py

      - name: Commit chart changes
        run: |
          if git diff --quiet -- assets/star-history-light.svg assets/star-history-dark.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history-light.svg assets/star-history-dark.svg
          git commit -m "Update Star History chart"
          git push
